name: zine
version: 0.1.0.0
build-type: Custom
custom-setup:
  dependencies:
    - base
    - Cabal
    - process
dependencies:
  - base
  - hs-conllu
  - inline-c-cpp
  - lens
  - nanopass
  - pretty-simple
  - typst
  - yi-core
executable:
  source-dirs: .
  main: Zine.lhs
  default-extensions:
    - BlockArguments
    - ConstraintKinds
    - DeriveFunctor
    - KindSignatures
    - LambdaCase
    - PolyKinds
    - QuasiQuotes
    - TemplateHaskell
    - TypeFamilies
    - UnicodeSyntax
  include-dirs:
    - udpipe/src_lib_only
  ghc-options:
    - -fobject-code
    - -dth-dec-file
