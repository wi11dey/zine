name: Build

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native and Haskell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango1.0-dev libfreetype-dev libfontconfig-dev \
            libwayland-dev libxkbcommon-dev libgmp-dev libtinfo-dev \
            zlib1g-dev haskell-stack

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Build
        run: cargo build --locked
