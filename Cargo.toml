[package]
name = "zine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A place for creativity."
publish = false

[dependencies]
dom_smoothie = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "glow", "wayland", "x11"] }
freetype-sys = "0.23"
pango = { version = "0.21", features = ["v1_56"] }
ropey = "1.6.1"
tempfile = "3"
tinyfiledialogs = "3.9.1"
typst = "0.15.1"
webrender = "0.70.0"
yeslogic-fontconfig-sys = "6.0"

[build-dependencies]
pkg-config = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
