[package]
name = "zine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A place for creativity."
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "glow", "wayland", "x11"] }
freetype-sys = "0.23"
pango = { version = "0.21", features = ["v1_56"] }
tempfile = "3"
yeslogic-fontconfig-sys = "6.0"

[build-dependencies]
pkg-config = "0.3"
