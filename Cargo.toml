[package]
name = "zine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A minimal egui shell for Zine"
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
freetype-rs = { version = "0.38", features = ["bundled"] }
harfrust = "0.12"
